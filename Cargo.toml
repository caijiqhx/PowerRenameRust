[package]
name = "power_rename"
version = "0.1.0"
edition = "2021"
description = "Batch file renaming tool with live preview (egui GUI)"

[lib]
name = "power_rename"
path = "src/lib.rs"

[[bin]]
name = "power_rename"
path = "src/main.rs"

[dependencies]
regex = "1"
fancy-regex = "0.14"
walkdir = "2"
csv = "1"
encoding_rs = "0.8"
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11"] }
egui_extras = "0.31"
rfd = "0.15"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"
